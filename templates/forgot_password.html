{% extends "base.html" %}

{% block content %}

<div class="page-bg-citizen-login">
    <div class="form-box my-0 shadow-lg">
        <h2 class="text-center mb-3 text-success fw-bold">🔑 Forgot Password</h2>
        <p class="text-center text-muted mb-4">Reset your Smart Village citizen account password</p>
        
        <form method="post" action="{{ url_for('forgot_password') }}">
            <div class="mb-3">
                <label class="form-label fw-bold">Registered Email Address</label>
                <input class="form-control" type="email" name="email" placeholder="Enter your registered email" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label fw-bold">New Password</label>
                <input class="form-control" type="password" name="new_password" placeholder="Enter new password" required>
            </div>
            
            <div class="mb-4">
                <label class="form-label fw-bold">Confirm New Password</label>
                <input class="form-control" type="password" name="confirm_password" placeholder="Confirm new password" required>
            </div>
            
            <button type="submit" class="btn btn-success w-100 py-2 fw-bold rounded-3">
                Reset Password
            </button>
        </form>
        
        <div class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top">
            <a href="{{ url_for('login') }}" class="text-success fw-bold text-decoration-none">← Back to Login</a>
            <a href="{{ url_for('register') }}" class="text-muted small">Register Account</a>
        </div>
    </div>
</div>

{% endblock %}
