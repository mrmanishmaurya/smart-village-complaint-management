<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citizen Login | Smart Village</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.5)), url("{{ url_for('static', filename='images/hero-bg1.jpg') }}") center/cover no-repeat;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-box {
            width: 440px;
            max-width: 100%;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.35);
        }
        .logo { text-align: center; font-size: 45px; margin-bottom: 5px; }
        h2 { text-align: center; color: #176b3a; font-weight: bold; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 20px; font-size: 14px; }
    </style>
</head>

<body>

<div class="login-box">
    <div class="logo">👤</div>
    <h2>Citizen Login</h2>
    <p class="subtitle">Login to manage your complaints & track progress</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }} py-2 px-3 small">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}">
        <input type="hidden" name="login_type" value="password">
        <div class="mb-3">
            <label class="form-label fw-bold">Email or Phone Number</label>
            <input type="text" name="email" class="form-control" placeholder="Enter email or mobile" required>
        </div>
        <div class="mb-4">
            <div class="d-flex justify-content-between align-items-center mb-1">
                <label class="form-label fw-bold mb-0">Password</label>
                <a href="{{ url_for('forgot_password') }}" class="small text-success fw-bold text-decoration-none">Forgot Password?</a>
            </div>
            <input type="password" name="password" class="form-control" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn btn-success w-100 py-2.5 fw-bold rounded-3 fs-6">Login to Account</button>
    </form>

    <div class="text-center mt-3 small text-muted">
        Don't have an account? <a href="{{ url_for('register') }}" class="text-success fw-bold text-decoration-none">Register Now</a>
    </div>
    <div class="text-center mt-2 small">
        <a href="{{ url_for('index') }}" class="text-secondary text-decoration-none">← Back to Home</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
