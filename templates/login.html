{% extends "base.html" %}

{% block content %}

<div class="page-bg-citizen-login">
    <div class="form-box my-0 shadow-lg">
        <h2 class="text-center mb-3 text-success fw-bold">👤 Citizen Login</h2>
        <p class="text-center text-muted mb-4">Access your Smart Village account</p>
        <form method="post">
            <div class="mb-3">
                <label class="form-label fw-bold">Email Address</label>
                <input class="form-control" type="email" name="email" placeholder="Enter your email" required>
            </div>
            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="form-label fw-bold mb-0">Password</label>
                    <a href="{{ url_for('forgot_password') }}" class="small text-success fw-bold text-decoration-none">Forgot Password?</a>
                </div>
                <input class="form-control" type="password" name="password" placeholder="Enter your password" required>
            </div>
            <button class="btn btn-success w-100 py-2 fw-bold rounded-3">Login to Account</button>
        </form>
        <p class="text-center mt-3 mb-0 text-muted">
            Don't have an account? <a href="{{ url_for('register') }}" class="text-success fw-bold">Register Here</a>
        </p>
    </div>
</div>

{% endblock %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Smart Village</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8f5e9, #ffffff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            width: 380px;
            max-width: 90%;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }

        .icon {
            text-align: center;
            font-size: 45px;
        }

        h2 {
            text-align: center;
            color: #176b3a;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #176b3a;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0f522b;
        }

        .register {
            text-align: center;
            margin-top: 20px;
        }

        .register a {
            color: #176b3a;
            font-weight: bold;
            text-decoration: none;
        }

        .back {
            text-align: center;
            margin-top: 15px;
        }

        .back a {
            color: #555;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="icon">👤</div>

    <h2>Citizen Login</h2>

    <p class="subtitle">
        Login to Smart Village
    </p>

    <form method="POST" action="{{ url_for('login') }}">

        <label>Email</label>

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Enter your password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <div class="register">
        Don't have an account?
        <a href="{{ url_for('register') }}">
            Register Now
        </a>
    </div>

    <div class="back">
        <a href="{{ url_for('index') }}">
            ← Back to Home
        </a>
    </div>

</div>

</body>
</html>
