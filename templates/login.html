{% extends "base.html" %}

{% block content %}

<div class="page-bg-citizen-login">
    <div class="form-box my-0 shadow-lg" style="max-width: 440px;">
        <h2 class="text-center mb-1 text-success fw-bold">👤 Citizen Login</h2>
        <p class="text-center text-muted mb-4">Access your Smart Village Complaint account</p>

        <form method="post" action="{{ url_for('login') }}">
            <input type="hidden" name="login_type" value="password">
            <div class="mb-3">
                <label class="form-label fw-bold">Email Address or Mobile</label>
                <input class="form-control" type="text" name="email" placeholder="Enter email or mobile" required>
            </div>
            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="form-label fw-bold mb-0">Password</label>
                    <a href="{{ url_for('forgot_password') }}" class="small text-success fw-bold text-decoration-none">Forgot Password?</a>
                </div>
                <input class="form-control" type="password" name="password" placeholder="Enter password" required>
            </div>
            <button class="btn btn-success w-100 py-2.5 fw-bold rounded-3 fs-6" type="submit">
                Login to Account
            </button>
        </form>

        <hr class="my-4">

        <p class="text-center mb-0 text-muted">
            Don't have an account? <a href="{{ url_for('register') }}" class="text-success fw-bold">Register Here</a>
        </p>
    </div>
</div>

{% endblock %}
